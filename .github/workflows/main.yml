name: Deploy Backend to EC2

on:
  push:
    branches:
      - admin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ec2-user/git/Dummy

            # Pull latest code
            git pull origin admin

            # Build Docker image
            sudo docker build -t dummy-admin .

            # Stop and remove old container
            sudo docker rm -f dummy-admin || true

            # Run new container
            sudo docker run -d \
              --name dummy-admin \
              -p 8080:8080 \
              dummy-admin

            # Verify container is running
            sudo docker ps
